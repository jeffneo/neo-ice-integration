# Docker stack for the Neo4j <-> Iceberg bidirectional integration test.
#
#   * iceberg-rest : Iceberg REST catalog (tracks table metadata)
#   * minio        : S3-compatible object store (holds the Iceberg data/metadata files)
#   * mc           : one-shot job that creates the "warehouse" bucket in MinIO
#   * spark-iceberg: Spark 3.5 runtime with Iceberg jars pre-installed; runs the jobs
#   * neo4j        : Neo4j (latest LTS), started by default. To use an external
#                    Neo4j (e.g. Aura) instead, point the NEO4J_* env vars at it
#                    and start Iceberg only:  make up-external

name: neo4j-iceberg-itest

services:
  iceberg-rest:
    image: tabulario/iceberg-rest:1.5.0
    networks: [iceberg_net]
    ports:
      - "8181:8181"
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-admin}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-password}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - CATALOG_WAREHOUSE=s3://warehouse/
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://minio:9000
      - CATALOG_S3_PATH__STYLE__ACCESS=true
    depends_on:
      minio:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    networks: [iceberg_net]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${AWS_ACCESS_KEY_ID:-admin}
      - MINIO_ROOT_PASSWORD=${AWS_SECRET_ACCESS_KEY:-password}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: create the warehouse bucket, then exit.
  mc:
    image: minio/mc:RELEASE.2024-08-17T11-33-50Z
    networks: [iceberg_net]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID:-admin} ${AWS_SECRET_ACCESS_KEY:-password};
      mc mb --ignore-existing local/warehouse;
      echo 'warehouse bucket ready';
      "

  spark-iceberg:
    image: tabulario/spark-iceberg:3.5.1_1.5.0
    networks: [iceberg_net]
    depends_on:
      iceberg-rest:
        condition: service_started
      minio:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-admin}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-password}
      - AWS_REGION=${AWS_REGION:-us-east-1}
    volumes:
      - ./src:/home/iceberg/jobs           # PySpark jobs, mounted read-write
      - ivy_cache:/root/.ivy2              # cache downloaded connector jars between runs
    ports:
      - "4040:4040"                        # Spark UI (shown while a job runs)
    # Bypass the image's notebook entrypoint and just idle, so the test can
    # `exec` spark-submit in (spark-submit runs local mode; no cluster needed).
    entrypoint: ["/bin/bash", "-c", "tail -f /dev/null"]

  # Neo4j, started by default as part of the stack. The bare `neo4j:5.26` tag is
  # the latest LTS. To run against an EXTERNAL Neo4j instead, point
  # NEO4J_URI / NEO4J_URI_HOST at it in .env and simply don't start this service.
  neo4j:
    image: neo4j:5.26
    networks: [iceberg_net]
    ports:
      - "7474:7474"   # HTTP / Browser
      - "7687:7687"   # Bolt
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-password12345}
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USERNAME:-neo4j} -p ${NEO4J_PASSWORD:-password12345} 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

networks:
  iceberg_net:
    driver: bridge

volumes:
  ivy_cache:
